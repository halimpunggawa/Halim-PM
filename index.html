<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18365b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Halim PM">
<link rel="manifest" href="manifest.webmanifest">
<title>Halim Project Manager</title>
<style>
:root{--navy:#18365b;--navy2:#244b78;--yellow:#f4bd20;--bg:#f3f5f8;--ink:#1d2938;--muted:#718096;--line:#e1e6ed;--white:#fff;--green:#16845b;--red:#c44545}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);padding-bottom:88px}
header{background:var(--navy);color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:5}
.topline{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:750;font-size:19px;letter-spacing:.1px}.sub{font-size:12px;color:#d2deeb;margin-top:4px}
main{max-width:760px;margin:auto;padding:16px}
h1{font-size:23px;margin:8px 0 4px}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat,.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #12243a08}
.stat strong{font-size:25px;display:block;margin-top:4px}.stat span{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wrap{flex-wrap:wrap}.pill{font-size:11px;padding:5px 9px;border-radius:30px;background:#edf2f8;color:var(--navy);font-weight:650}
button,.btn{border:0;border-radius:11px;background:var(--navy);color:white;padding:11px 14px;font-size:14px;font-weight:650;cursor:pointer}
button.secondary{background:#edf2f8;color:var(--navy)}button.yellow{background:var(--yellow);color:#1d2938}button.danger{background:#fff0f0;color:var(--red)}button.small{padding:8px 10px;font-size:12px}
input,select,textarea{width:100%;border:1px solid #d8dee7;border-radius:10px;padding:11px 12px;font:inherit;background:white;color:var(--ink);margin:5px 0 12px}
textarea{min-height:76px;resize:vertical}label{font-size:12px;font-weight:650;color:#536174;display:block;margin-top:5px}
.progress{height:9px;background:#e9edf2;border-radius:20px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;background:var(--yellow);border-radius:20px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:8}
.tab{background:transparent;color:#69778a;padding:7px 2px;font-size:10px;border-radius:9px;font-weight:600}.tab b{display:block;font-size:18px;margin-bottom:3px}.tab.active{color:var(--navy);background:#edf2f8}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:10px 0 12px}.empty{text-align:center;padding:24px;color:var(--muted);font-size:13px}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.photo-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#eef1f5}
.hidden{display:none!important}.actions{display:flex;gap:7px;flex-wrap:wrap}.total{font-size:23px;font-weight:800;color:var(--navy)}
footer{text-align:center;color:#98a2b1;font-size:11px;padding:20px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.photo-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><div class="topline"><div><div class="brand">HALIM PROJECT MANAGER</div><div class="sub">Monitoring proyek konstruksi</div></div><span style="font-size:23px">⌂</span></div></header>
<main id="app"></main>
<nav class="tabs">
<button class="tab active" data-tab="home"><b>⌂</b>Beranda</button>
<button class="tab" data-tab="projects"><b>▦</b>Proyek</button>
<button class="tab" data-tab="progress"><b>◷</b>Progres</button>
<button class="tab" data-tab="photos"><b>▧</b>Foto</button>
<button class="tab" data-tab="more"><b>☷</b>Lainnya</button>
</nav>
<script>
const KEY='halimPM_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 projects:[{id:'p1',name:'Contoh Pembangunan Gedung',client:'Contoh pemilik proyek',location:'Jayapura',start:'2026-11-01',end:'2027-03-01',budget:850000000,status:'Berjalan'}],
 tasks:[{id:'t1',project:'p1',name:'Pekerjaan persiapan',unit:'ls',volume:1,done:1,weight:5},{id:'t2',project:'p1',name:'Pekerjaan pondasi',unit:'m³',volume:35,done:17.5,weight:20},{id:'t3',project:'p1',name:'Pekerjaan struktur beton',unit:'m³',volume:80,done:0,weight:35}],
 rab:[{id:'r1',project:'p1',name:'Semen',unit:'zak',qty:100,price:125000},{id:'r2',project:'p1',name:'Pasir',unit:'m³',qty:15,price:800000}],
 team:[{id:'u1',name:'Halim',role:'Project Manager',phone:''}],
 photos:[]
};
let currentTab='home', activeProject=db.projects[0]?.id||'', reportDate=new Date().toISOString().slice(0,10);
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const id=()=>Math.random().toString(36).slice(2,10);
const rupiah=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const project=()=>db.projects.find(p=>p.id===activeProject);
const tasks=()=>db.tasks.filter(t=>t.project===activeProject);
const taskPct=t=>t.volume?Math.min(100,Math.max(0,Number(t.done)/Number(t.volume)*100)):0;
const overall=()=>{let ts=tasks();let sum=ts.reduce((a,t)=>a+Number(t.weight||0),0);return sum?ts.reduce((a,t)=>a+taskPct(t)*Number(t.weight||0),0)/sum:0};
function shell(content){document.getElementById('app').innerHTML=content;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab))}
function selectProject(){return `<label>Proyek aktif</label><select id="activeProject">${db.projects.map(p=>`<option value="${p.id}" ${p.id===activeProject?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`}
function home(){let p=project();let pct=overall();shell(`<h1>Ringkasan proyek</h1><p class="muted">Pantau pekerjaan dan dokumentasi lapangan Anda.</p>${selectProject()}<div class="grid"><div class="stat"><span>Total proyek</span><strong>${db.projects.length}</strong></div><div class="stat"><span>Anggota tim</span><strong>${db.team.length}</strong></div><div class="stat"><span>Item pekerjaan</span><strong>${tasks().length}</strong></div><div class="stat"><span>Dokumentasi foto</span><strong>${db.photos.filter(x=>x.project===activeProject).length}</strong></div></div>${p?`<div class="card"><div class="row"><h2>${esc(p.name)}</h2><span class="pill">${esc(p.status)}</span></div><div class="muted">${esc(p.location)} · ${esc(p.client)}</div><div class="progress"><i style="width:${pct}%"></i></div><div class="row"><b>Progres tertimbang</b><strong>${pct.toFixed(1)}%</strong></div><p class="muted">Target selesai: ${esc(p.end||'-')}</p><div class="actions"><button onclick="go('progress')">Lihat progres</button><button class="secondary" onclick="go('reports')">Buat laporan</button></div></div>`:'<div class="card empty">Belum ada proyek. Tambahkan proyek pertama Anda.</div>'}<div class="card"><h2>Aktivitas terbaru</h2>${db.photos.filter(x=>x.project===activeProject).slice(-3).reverse().map(x=>`<div class="item"><b>${esc(x.taskName)}</b><div class="muted">${esc(x.date)} · ${esc(x.note||'Dokumentasi foto')}</div></div>`).join('')||'<div class="muted">Belum ada dokumentasi.</div>'}</div>`);bindCommon()}
function projects(){shell(`<div class="section-head"><h1>Daftar proyek</h1><button onclick="projectForm()">＋ Tambah</button></div>${db.projects.map(p=>`<div class="card"><div class="row"><b>${esc(p.name)}</b><span class="pill">${esc(p.status)}</span></div><p class="muted">${esc(p.location)} · ${esc(p.client)}</p><div class="row"><span class="muted">Anggaran</span><b>${rupiah(p.budget)}</b></div><div class="actions" style="margin-top:12px"><button class="small" onclick="setActive('${p.id}')">Pilih proyek</button><button class="small secondary" onclick="editProject('${p.id}')">Edit</button><button class="small danger" onclick="deleteProject('${p.id}')">Hapus</button></div></div>`).join('')||'<div class="card empty">Belum ada proyek.</div>'}`)}
function projectForm(pid){let p=db.projects.find(x=>x.id===pid)||{};shell(`<div class="section-head"><h1>${pid?'Edit proyek':'Proyek baru'}</h1><button class="secondary" onclick="go('projects')">Kembali</button></div><div class="card"><form id="projectForm"><label>Nama proyek *</label><input name="name" required value="${esc(p.name||'')}" placeholder="Contoh: Pembangunan gedung kantor"><label>Pemilik proyek</label><input name="client" value="${esc(p.client||'')}"><label>Lokasi proyek</label><input name="location" value="${esc(p.location||'')}"><label>Tanggal mulai</label><input name="start" type="date" value="${esc(p.start||'')}"><label>Target selesai</label><input name="end" type="date" value="${esc(p.end||'')}"><label>Nilai/anggaran proyek (Rp)</label><input name="budget" type="number" min="0" value="${esc(p.budget||'')}"><label>Status</label><select name="status"><option ${p.status==='Berjalan'?'selected':''}>Berjalan</option><option ${p.status==='Persiapan'?'selected':''}>Persiapan</option><option ${p.status==='Selesai'?'selected':''}>Selesai</option><option ${p.status==='Ditunda'?'selected':''}>Ditunda</option></select><button>Simpan proyek</button></form></div>`);document.getElementById('projectForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.id=pid||id();d.budget=Number(d.budget);if(pid)db.projects=db.projects.map(x=>x.id===pid?d:x);else{db.projects.push(d);activeProject=d.id}save();go('projects')}}
function editProject(id){projectForm(id)}function deleteProject(id){if(confirm('Hapus proyek beserta data pekerjaan dan RAB-nya?')){db.projects=db.projects.filter(p=>p.id!==id);db.tasks=db.tasks.filter(t=>t.project!==id);db.rab=db.rab.filter(r=>r.project!==id);db.photos=db.photos.filter(x=>x.project!==id);if(activeProject===id)activeProject=db.projects[0]?.id||'';save();go('projects')}}
function setActive(id){activeProject=id;go('home')}
function progress(){shell(`<div class="section-head"><h1>Progres pekerjaan</h1><button onclick="taskForm()">＋ Item</button></div>${selectProject()}<div class="card"><div class="row"><b>Progres tertimbang proyek</b><strong>${overall().toFixed(1)}%</strong></div><div class="progress"><i style="width:${overall()}%"></i></div><p class="muted">Rumus: progres volume tiap item dikalikan bobot pekerjaan.</p></div>${tasks().map(t=>`<div class="card"><div class="row"><b>${esc(t.name)}</b><span class="pill">${taskPct(t).toFixed(0)}%</span></div><div class="muted">${t.done} / ${t.volume} ${esc(t.unit)} · Bobot ${t.weight}%</div><div class="progress"><i style="width:${taskPct(t)}%"></i></div><div class="actions"><button class="small" onclick="taskForm('${t.id}')">Ubah progres / item</button><button class="small secondary" onclick="go('photos','${t.id}')">Tambah foto</button></div></div>`).join('')||'<div class="card empty">Belum ada item pekerjaan untuk proyek ini.</div>'}`);bindCommon()}
function taskForm(tid){let t=db.tasks.find(x=>x.id===tid)||{};shell(`<div class="section-head"><h1>${tid?'Ubah pekerjaan':'Item pekerjaan baru'}</h1><button class="secondary" onclick="go('progress')">Kembali</button></div><div class="card"><form id="taskForm"><label>Nama pekerjaan *</label><input name="name" required value="${esc(t.name||'')}"><label>Satuan</label><input name="unit" value="${esc(t.unit||'ls')}" placeholder="m², m³, unit, ls"><label>Volume rencana</label><input name="volume" type="number" step="0.01" min="0" value="${esc(t.volume??'')}"><label>Volume selesai</label><input name="done" type="number" step="0.01" min="0" value="${esc(t.done??0)}"><label>Bobot pekerjaan (%)</label><input name="weight" type="number" step="0.01" min="0" max="100" value="${esc(t.weight??0)}"><button>Simpan pekerjaan</button>${tid?` <button type="button" class="danger" onclick="deleteTask('${tid}')">Hapus</button>`:''}</form></div>`);document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));Object.assign(d,{id:tid||id(),project:activeProject,volume:Number(d.volume),done:Number(d.done),weight:Number(d.weight)});if(d.done>d.volume){alert('Volume selesai tidak boleh melebihi volume rencana.');return}if(tid)db.tasks=db.tasks.map(x=>x.id===tid?d:x);else db.tasks.push(d);save();go('progress')}}
function deleteTask(id){db.tasks=db.tasks.filter(t=>t.id!==id);save();go('progress')}
function photos(taskId){let ts=tasks();shell(`<h1>Dokumentasi foto</h1><p class="muted">Simpan foto lapangan berdasarkan item pekerjaan dan tanggal.</p>${selectProject()}<div class="card"><form id="photoForm"><label>Pilih pekerjaan</label><select name="task" required>${ts.map(t=>`<option value="${t.id}" ${t.id===taskId?'selected':''}>${esc(t.name)}</option>`).join('')}</select><label>Tanggal foto</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}" required><label>Kondisi pekerjaan</label><select name="condition"><option value="0">0% · Belum dikerjakan</option><option value="50">50% · Sedang dikerjakan</option><option value="100">100% · Selesai</option></select><label>Catatan lapangan</label><textarea name="note" placeholder="Contoh: Pengecoran sloof sisi timur..."></textarea><label>Ambil atau pilih foto</label><input type="file" name="image" accept="image/*" capture="environment" required><button>Tambahkan dokumentasi</button></form></div><h2>Foto tersimpan</h2><div id="photoList" class="photo-grid">${db.photos.filter(x=>x.project===activeProject).map(x=>`<div class="card"><img src="${x.image}" alt="Foto pekerjaan"><b>${esc(x.taskName)}</b><div class="muted">${esc(x.date)} · ${x.condition}%</div><div class="muted">${esc(x.note)}</div><button class="small danger" onclick="deletePhoto('${x.id}')">Hapus</button></div>`).join('')||'<div class="empty">Belum ada foto.</div>'}</div>`);bindCommon();document.getElementById('photoForm').onsubmit=async e=>{e.preventDefault();let f=e.target.image.files[0];if(!f)return;let img=await compressImage(f);let fd=new FormData(e.target),t=db.tasks.find(x=>x.id===fd.get('task'));db.photos.push({id:id(),project:activeProject,task:fd.get('task'),taskName:t?.name||'Pekerjaan',date:fd.get('date'),condition:fd.get('condition'),note:fd.get('note'),image:img});save();photos()}}
function compressImage(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1280/Math.max(im.width,im.height));c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function deletePhoto(id){if(confirm('Hapus foto ini?')){db.photos=db.photos.filter(x=>x.id!==id);save();photos()}}
function more(){shell(`<h1>Data proyek lainnya</h1><div class="card"><div class="row"><div><b>RAB dan harga pekerjaan</b><div class="muted">Daftar kebutuhan dan biaya proyek</div></div><button onclick="rab()">Buka</button></div></div><div class="card"><div class="row"><div><b>Tim proyek</b><div class="muted">Penanggung jawab dan anggota tim</div></div><button onclick="team()">Buka</button></div></div><div class="card"><div class="row"><div><b>Laporan proyek</b><div class="muted">Cetak atau simpan laporan sebagai PDF</div></div><button onclick="reports()">Buka</button></div></div><div class="card"><b>Cadangan data</b><p class="muted">Ekspor data untuk menyimpan salinan di luar iPhone.</p><div class="actions"><button onclick="backup()">Ekspor JSON</button><button class="secondary" onclick="document.getElementById('restore').click()">Impor JSON</button><input id="restore" class="hidden" type="file" accept="application/json"></div></div>`);document.getElementById('restore').onchange=restore}
function rab(){let rows=db.rab.filter(x=>x.project===activeProject),total=rows.reduce((s,x)=>s+x.qty*x.price,0);shell(`<div class="section-head"><h1>RAB dan harga</h1><button onclick="rabForm()">＋ Item</button></div>${selectProject()}<div class="card"><div class="muted">Total estimasi item RAB</div><div class="total">${rupiah(total)}</div></div>${rows.map(r=>`<div class="card"><div class="row"><b>${esc(r.name)}</b><b>${rupiah(r.qty*r.price)}</b></div><div class="muted">${r.qty} ${esc(r.unit)} × ${rupiah(r.price)}</div><button class="small secondary" onclick="rabForm('${r.id}')">Edit item</button> <button class="small danger" onclick="deleteRab('${r.id}')">Hapus</button></div>`).join('')||'<div class="card empty">Belum ada item RAB.</div>'}`);bindCommon()}
function rabForm(rid){let r=db.rab.find(x=>x.id===rid)||{};shell(`<div class="section-head"><h1>${rid?'Edit item RAB':'Item RAB baru'}</h1><button class="secondary" onclick="rab()">Kembali</button></div><div class="card"><form id="rabForm"><label>Uraian pekerjaan / material *</label><input name="name" required value="${esc(r.name||'')}"><label>Satuan</label><input name="unit" value="${esc(r.unit||'unit')}"><label>Volume</label><input name="qty" type="number" step="0.01" min="0" value="${esc(r.qty??'')}"><label>Harga satuan (Rp)</label><input name="price" type="number" min="0" value="${esc(r.price??'')}"><button>Simpan item</button></form></div>`);document.getElementById('rabForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));Object.assign(d,{id:rid||id(),project:activeProject,qty:Number(d.qty),price:Number(d.price)});if(rid)db.rab=db.rab.map(x=>x.id===rid?d:x);else db.rab.push(d);save();rab()}}
function deleteRab(id){db.rab=db.rab.filter(x=>x.id!==id);save();rab()}
function team(){shell(`<div class="section-head"><h1>Tim proyek</h1><button onclick="teamForm()">＋ Anggota</button></div>${db.team.map(t=>`<div class="card"><div class="row"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.role)} · ${esc(t.phone||'Tanpa nomor')}</div></div><button class="small secondary" onclick="teamForm('${t.id}')">Edit</button></div><button class="small danger" style="margin-top:8px" onclick="deleteTeam('${t.id}')">Hapus</button></div>`).join('')||'<div class="card empty">Belum ada anggota tim.</div>'}`)}
function teamForm(tid){let t=db.team.find(x=>x.id===tid)||{};shell(`<div class="section-head"><h1>Anggota tim</h1><button class="secondary" onclick="team()">Kembali</button></div><div class="card"><form id="teamForm"><label>Nama *</label><input name="name" required value="${esc(t.name||'')}"><label>Jabatan / tanggung jawab</label><input name="role" value="${esc(t.role||'')}"><label>Nomor telepon</label><input name="phone" type="tel" value="${esc(t.phone||'')}"><button>Simpan anggota</button></form></div>`);document.getElementById('teamForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.id=tid||id();if(tid)db.team=db.team.map(x=>x.id===tid?d:x);else db.team.push(d);save();team()}}
function deleteTeam(id){db.team=db.team.filter(x=>x.id!==id);save();team()}
function reports(){let p=project();if(!p){shell('<h1>Laporan</h1><div class="card empty">Tambahkan proyek terlebih dahulu.</div>');return}let ts=tasks(),r=db.rab.filter(x=>x.project===activeProject),pct=overall();shell(`<div class="section-head"><h1>Laporan proyek</h1><button class="yellow" onclick="window.print()">Cetak / PDF</button></div><div class="card" id="printArea"><h2>HALIM PROJECT MANAGER</h2><h1>${esc(p.name)}</h1><p class="muted">${esc(p.location)} · ${esc(p.client)}</p><div class="row"><span>Periode laporan</span><input id="reportDate" type="date" value="${reportDate}" style="width:auto;margin:0"></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="grid"><div><span class="muted">Progres</span><div class="total">${pct.toFixed(1)}%</div></div><div><span class="muted">Nilai proyek</span><b>${rupiah(p.budget)}</b></div></div><h2>Rekap pekerjaan</h2>${ts.map(t=>`<div class="item"><div class="row"><b>${esc(t.name)}</b><b>${taskPct(t).toFixed(1)}%</b></div><div class="muted">${t.done} / ${t.volume} ${esc(t.unit)} · Bobot ${t.weight}%</div></div>`).join('')||'<p class="muted">Belum ada item pekerjaan.</p>'}<h2>Rekap RAB</h2>${r.map(x=>`<div class="item row"><span>${esc(x.name)} (${x.qty} ${esc(x.unit)})</span><b>${rupiah(x.qty*x.price)}</b></div>`).join('')}<div class="row"><b>Total RAB tercatat</b><b>${rupiah(r.reduce((s,x)=>s+x.qty*x.price,0))}</b></div><h2>Dokumentasi foto</h2><p>${db.photos.filter(x=>x.project===activeProject).length} foto tersimpan.</p><p class="muted">Dibuat melalui Halim Project Manager.</p></div>`);document.getElementById('reportDate').onchange=e=>{reportDate=e.target.value}}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});download(blob,'halim-project-manager-backup.json')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.projects||!d.tasks)throw 0;db=d;activeProject=db.projects[0]?.id||'';save();go('home');alert('Data berhasil diimpor.')}catch{alert('File cadangan tidak valid.')}};r.readAsText(f)}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function bindCommon(){let s=document.getElementById('activeProject');if(s)s.onchange=()=>{activeProject=s.value;go(currentTab)}}
function go(tab,arg){currentTab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({home,projects,progress,photos:()=>photos(arg),more,reports})[tab]()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
go('home');
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
